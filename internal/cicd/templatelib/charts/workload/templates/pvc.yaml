{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) (ne .Values.workload.kind "StatefulSet") }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  {{- if .Values.persistence.retain }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
spec:
  {{- include "axiops.pvcSpec" . | nindent 2 }}
{{- end }}
