Name: devops-manager.rpc
ListenOn: 0.0.0.0:30031
Timeout: 30000
Mode: dev

Log:
  ServiceName: devops-manager-rpc
  Mode: "console"
  Encoding: "plain"
  TimeFormat: "2006-01-02 15:04:05"
  Path: "logs"
  Level: "info"
  Compress: false
  Stat: true
  KeepDays: 7
  StackCooldownMillis: 100
  MaxBackups: 0
  MaxSize: 0
  Rotation: "daily"

Mongo:
  Url: mongodb://root:Mongo%40123456@127.0.0.1:27017/?authSource=admin
  Db: autoops_devops

Bootstrap:
  DefaultDataEnabled: false
  TektonStepSyncEnabled: false

Cache:
  Host: 127.0.0.1:6379
  Type: node
  Pass: "REPLACE_ME"
  Tls: false
  NonBlock: true
  PingTimeout: 3s

StorageConf:
  Provider: minio
  Endpoints: [ "127.0.0.1:9000" ]
  EndpointProxy: "http://127.0.0.1:9000"
  AccessKey: "REPLACE_ME"
  AccessSecret: "REPLACE_ME"
  BucketName: devops-artifacts
  CAFile: ""
  CAKey: ""
  ClientCertFile: ""
  ClientKeyFile: ""
  UseTLS: false
# Portal RPC 服务
PortalRpc:
  Endpoints:
    - 127.0.0.1:30010
