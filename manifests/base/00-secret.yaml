---
apiVersion: v1
kind: Secret
metadata:
  name: kube-nova-secret
  namespace: kube-nova
type: Opaque
stringData:
  # 全局超时
  DEFAULT_TIMEOUT: "30000"

  # MySQL 基础参数
  MYSQL_HOST: "mysql"
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: "kube_nova"
  MYSQL_USER: "root"
  MYSQL_PASSWORD: "REPLACE_ME"
  MYSQL_MAX_OPEN_CONNS: "100"
  MYSQL_MAX_IDLE_CONNS: "50"
  MYSQL_CONN_MAX_LIFETIME: "30m"

  # Redis 基础参数
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_PASSWORD: "REPLACE_ME"
  REDIS_TYPE: "node"
  REDIS_TLS: "false"
  REDIS_NONBLOCK: "true"
  REDIS_PING_TIMEOUT: "3s"

  # MinIO 配置
  MINIO_ENDPOINT: "minio-service:9000"
  MINIO_ACCESS_KEY: "kube-nova-admin"
  MINIO_SECRET_KEY: "REPLACE_ME"
  MINIO_BUCKET: "kube-nova"
  MINIO_USE_TLS: "false"

  # JWT
  JWT_ACCESS_SECRET: "REPLACE_ME"
  JWT_ACCESS_EXPIRE: "86400"
  JWT_REFRESH_SECRET: "REPLACE_ME"
  JWT_REFRESH_EXPIRE: "604800"
  JWT_REFRESH_AFTER: "604800"

  # Webhook
  ALERTMANAGER_WEBHOOK_TOKEN: "REPLACE_ME"

  # Jaeger
  JAEGER_ENDPOINT: "http://jaeger-collector:14268/api/traces"
  TELEMETRY_SAMPLER: "1.0"
  TELEMETRY_BATCHER: "jaeger"

  # Portal
  PORTAL_NAME: "Kube-Nova 云原生平台"
  PORTAL_URL: "http://www.yanshicheng.com:8888"
  DEMO_MODE: "true"

  # 其他
  INJECT_IMAGE: "harbor.ikubeops.local/public/network-multitool:latest"
  # MongoDB 配置
  MONGO_URL: "mongodb://root:REPLACE_ME@mongodb:27017/?authSource=admin"
  MONGO_DB: "kube_nova_devops"
  MONGO_USER: "root"
  MONGO_PASSWORD: "REPLACE_ME"

  # DevOps 启动配置
  DEVOPS_BOOTSTRAP_DEFAULT_DATA: "false"
  DEVOPS_BOOTSTRAP_TEKTON_SYNC: "false"
